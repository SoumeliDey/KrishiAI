  ${locH('pb_l',u.state||'West Bengal',u.district||'Bardhaman')}
  ${inp('pb_vil',t('village'),'text',u.village||'')}
  ${inp('pb_addr',t('addr'),'text',u.addr||'')}
  <div class="f">
    ${inp('pb_lat',t('lat'),'number',hasC?u.lat:'','0','step="any" placeholder="23.2324"')}
    ${inp('pb_lng',t('lng'),'number',hasC?u.lng:'','0','step="any" placeholder="87.0650"')}
  </div>
  <label class="chk"><input id="pb_share" type="checkbox" ${shared?'checked':''}><span>${t('share_loc_opt')}</span></label>
  <div class="row">
    <button type="button" class="b o sm" onclick="requestBuyerGps()">📍 ${t('use_my_loc')}</button>
    <button type="button" class="b g2 sm" onclick="clearBuyerCoords()">✕ ${t('clear_loc')}</button>
    <button type="button" class="b sm" onclick="saveBuyerProfile()">💾 ${t('save_loc')}</button>
  </div>
  <div id="gpsConfirmArea"></div>
  </div>`;
}
function requestBuyerGps(){
  if(!navigator.geolocation)return toast(t('gps_unavail'));
  const exp=confirm(t('buyer_gps_explain'));
  if(!exp)return;
  toast('📍 ...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=+pos.coords.latitude.toFixed(6),lng=+pos.coords.longitude.toFixed(6);
    PENDING_LOC={lat,lng};
    $('#gpsConfirmArea').innerHTML=`<div class="confirmBox"><b>${t('review_loc')}:</b> ${lat}, ${lng}<br><small>${t('confirm_loc_hint')}</small><div class="row"><button type="button" class="b sm" onclick="confirmPendingGps()">✔ ${t('confirm_loc')}</button><button type="button" class="b g2 sm" onclick="PENDING_LOC=null;$('#gpsConfirmArea').innerHTML=''">✕ ${t('cancel')}</button></div></div>`;
  },()=>toast(t('gps_denied')),{enableHighAccuracy:false,timeout:12000});
}
function confirmPendingGps(){if(!PENDING_LOC)return;if($('#pb_lat'))$('#pb_lat').value=PENDING_LOC.lat;if($('#pb_lng'))$('#pb_lng').value=PENDING_LOC.lng;if($('#pb_share'))$('#pb_share').checked=true;PENDING_LOC=null;$('#gpsConfirmArea').innerHTML=`<small>✅ ${t('loc_ready_save')}</small>`}
function clearBuyerCoords(){if($('#pb_lat'))$('#pb_lat').value='';if($('#pb_lng'))$('#pb_lng').value='';if($('#pb_share'))$('#pb_share').checked=false;PENDING_LOC=null;if($('#gpsConfirmArea'))$('#gpsConfirmArea').innerHTML='';toast(t('loc_cleared'))}
function saveBuyerProfile(){if(!me||me.role!=='buyer')return;const latV=$('#pb_lat').value.trim(),lngV=$('#pb_lng').value.trim(),share=$('#pb_share').checked;
  if(share&&(!latV||!lngV||Number.isNaN(+latV)||Number.isNaN(+lngV)))return toast(t('need_coords_share'));
  me.biz=$('#pb_biz').value.trim();me.btype=$('#pb_type').value;me.state=$('#pb_ls').value;me.district=$('#pb_ld').value;me.village=$('#pb_vil').value.trim();me.addr=$('#pb_addr').value.trim();
  me.lat=latV!==''&&!Number.isNaN(+latV)?+latV:null;me.lng=lngV!==''&&!Number.isNaN(+lngV)?+lngV:null;me.locShare=share?1:0;
  save();toast('✅ '+t('saved'));render()}

function filteredBuyers(){
  const buyers=DB.users.filter(u=>u.role==='buyer'&&u.locShare);
  const enriched=buyers.map(b=>{
    const dist=F_LOC&&hasCoords(b)?havKm(F_LOC.lat,F_LOC.lng,b.lat,b.lng):null;
    return{...b,dist};
  });
  const list=enriched.filter(b=>{
    const hay=[b.name,b.biz,b.btype,b.village,b.district,b.state,b.addr].filter(Boolean).join(' ').toLowerCase();
    if(NF.q&&!hay.includes(NF.q.toLowerCase()))return false;
    if(NF.st&&b.state!==NF.st)return false;
    if(NF.di&&b.district!==NF.di)return false;

function renderNearbyMap(list){
  const mapEl=$('#buyerMap');if(!mapEl)return;

  MAP_LAYER.clearLayers();

    const popupHtml=`<div style="min-width:190px"><b>🏪 ${esc(b.biz||b.name)}</b><br><small>${esc(b.name)} · ${esc(b.btype||'')}</small><br><small>📍 ${esc([b.village,b.district,b.state].filter(Boolean).join(', '))}</small>${b.dist!==null?`<br><b>📏 ${fmtDist(b.dist)}</b>`:''}<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap"><a target="_blank" rel="noopener" href="${gmapsSearchUrl(b)}">Google Maps</a> · <a target="_blank" rel="noopener" href="${gmapsDirUrl(b)}">${t('get_dir')}</a></div><div style="margin-top:6px;display:flex;gap:4px"><button type="button" onclick="contactBuyer('${b.id}')">💬 ${t('contact_buyer')}</button><button type="button" onclick="enquireBuyer('${b.id}')">📨</button></div></div>`;
    L.marker([b.lat,b.lng]).addTo(MAP_LAYER).bindPopup(popupHtml);
  });
  if(F_LOC){
    bounds.push([F_LOC.lat,F_LOC.lng]);
    L.circleMarker([F_LOC.lat,F_LOC.lng],{radius:8,color:'#0f5132',fillColor:'#10b981',fillOpacity:.9}).addTo(MAP_LAYER).bindPopup(`<b>👨‍🌾 ${t('your_loc')}</b>`);

}
